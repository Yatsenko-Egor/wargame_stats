{% extends "base.html" %}

{% block title %}
    Вход — Wargame Stats
{% endblock %}


{% block content %}

<div class="page">

    <div class="auth-container">

        <div class="auth-card">

            <h1 class="auth-title">
                Вход
            </h1>


            {% if error %}
                <div class="form-error">
                    {{ error }}
                </div>
            {% endif %}


            <form
                method="post"
                action="{{ url_for('auth.login') }}"
            >

                {% if next %}
                    <input
                        type="hidden"
                        name="next"
                        value="{{ next }}"
                    >
                {% endif %}

                <div class="form-group">
                    <label
                        for="email"
                        class="form-label"
                    >
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-input"
                        maxlength="255"
                        required
                        autocomplete="email"
                    >
                </div>


                <div class="form-group">
                    <label
                        for="password"
                        class="form-label"
                    >
                        Пароль
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        required
                        autocomplete="current-password"
                    >
                </div>


                <div class="form-actions">
                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Войти
                    </button>
                </div>

            </form>


            <div class="auth-footer">
                Нет аккаунта?
                <a href="{{ url_for('auth.register') }}">
                    Зарегистрироваться
                </a>
            </div>

        </div>

    </div>

</div>

{% endblock %}
